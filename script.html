<script>
	$(document).ready(function() {
    
    $('.changeItem').change(function(){
        $('#generate').click();
    });

    $(document).keypress(function (e) {
        var key = e.which;
         if(key == 13)  // the enter key code
         {
            $('#generate').click();
             return false;  
          }
    });
    
    $('#video-button').hide();
    
    var testing = false;
    $('#generate').click(function(){
        if(!testing){$("#answer").hide(); $("#show-answer").val("Show Answer");}

        var type;
        // handles the formatting for selecting any type
        if($("#type").val()=="any"){type = random(1,4);}
        else{type = parseInt($("#type").val())}

        generate(type);       
     });


    $("#show-answer").click(function(){
       if($("#answer").is(":hidden") ){
          $("#answer").show();
          $("#show-answer").val("Hide Answer");
       } else{
         $("#answer").hide();
         $("#show-answer").val("Show Answer");
        }
    });
    
    if(testing){ $("#answer").show();}
    
	});
	function generate(type){
       
       var videoLinks = ["https://www.youtube.com/watch?v=bz_CINpgVWo",
                         "https://www.youtube.com/watch?v=PCSx2Bu3Wwc",
                         "",
                         ""
                         ];
       
       if(videoLinks[type-1].length != 0){ 
         $("#videoLink"). attr("href", videoLinks[type-1]);
         $('#video-button').show();
       }
       else{
         $('#video-button').hide();
       }
       
       var problem = "";
       var answer = "";
       var a,b,c,d,e,f,g,h,sf;
       $("#generated").html("");
       $("#answer").html("");
   
       switch(type) {
           // Determine the scale factor
           // (between corresponding points, side lengths, perimeters, areas, going in the opposite direction)
           case 1: 
           
           sf = random(2,10);
           a = random(2,20);
           b = sf*a;
           var og = "DOG";
           var img = "MAT"
           var shape = "Triangle";
           var shapeL = "triangle";

           if(random(0,1)===0){ og = "DOGS"; img = "MATH"; shape = "Rectangle"; shapeL = "rectangle";}

          problem = `${shape} ${og} is similar to ${shapeL} ${img}. <br><br>If DO corresponds to MA, DO = ${a}, and MA = ${b}, what is the scale factor from `;

          switch(random(0,1)){

              // small to big SF
              case 0:
              problem +=  `${og} to ${img}?`;
              answer = "Scale factor \\(= "+sf+"\\)"; 
              break;
              // big to small SF

              case 1:
              problem +=  `${img} to ${og}?`;
              answer = "Scale factor \\( = \\cfrac{1}{ "+sf+"}\\)";
              break;

          }
          
          /*
          switch(random(0,4)){
                           
              // Using corresponding points, determine the scale factor
              case 0:
                a = random(-10,10);
                b = random(-10,10);
                c = a*sf;
                d = b*sf;
                
                problem = "A scale factor is applied to coordinate point \\(("+a+", "+b+")\\) to become the new point \\(("+c+", "+d+")\\). What is the scale factor?";
              
              break;
           
              // Using corresponding side lengths, determine the scale factor
              case 1:
                a = random(2,20);
                b = sf*a;
                
                problem = "Triangle \\(ABC\\) is similar to triangle \\(DEF\\). <br><br>If \\(AB\\) corresponds to \\(DE\\), \\(AB="+a+"\\), and \\(DE="+b+"\\), what is the scale factor from \\(ABC\\) to \\(DEF\\)? ";
              
              break;
              
              // Using corresponding perimeters, determine the scale factor
              case 2:
                a = random(15,100);
                b = sf*a;
                
                problem = "Triangle \\(ABC\\) is similar to triangle \\(DEF\\). <br><br>If the perimeter of \\(ABC\\) is \\("+a+"\\) and the perimeter of \\(DEF\\) is \\("+b+"\\), what is the scale factor from \\(ABC\\) to \\(DEF\\)? ";
              
              break;
              
              // Using corresponding areas, determine the scale factor
              case 3:
                a = random(15,50);
                b = sf*sf*a;
                
                problem = "Triangle \\(ABC\\) is similar to triangle \\(DEF\\). <br><br>If the area of \\(ABC\\) is \\("+a+"\\) and the area of \\(DEF\\) is \\("+b+"\\), what is the scale factor from \\(ABC\\) to \\(DEF\\)? ";
                         
              break;
              
              // Using scale factor from A to B, find scale factor from B to A
              case 4:
                a = random(15,50);
                b = sf*sf*a;
                
                problem = "Triangle \\(ABC\\) is similar to triangle \\(DEF\\). <br><br>If the scale factor from \\(DEF\\) to \\(ABC\\) is \\(\\frac{1}{"+sf+"}\\), what is the scale factor from \\(ABC\\) to \\(DEF\\)? ";
              
              break;
           
           }
           */
           
           break;
           
           // Converting the scale factor
           // Scale factor conversion between percent, decimal, and rule
           // No longer used as of Summer 2026
           case 5: 
           sf = randomDec(2,10,1); 
           a = formatDec(sf*100); // percent
           b = "\\(("+sf+"x, "+sf+"y)\\)"; //rule
           switch(random(0,1)){
              
              // Decimal to rule and percent
              case 0:
              //problem = "The scale factor from shape \\(A\\) to shape \\(B\\) is \\("+sf+"\\). What is this written as a percent and as a coordinate rule?";
              problem = "The scale factor from shape \\(A\\) to shape \\(B\\) is \\("+sf+"\\). What is this written as a coordinate rule?";
              //answer = "Percent = \\("+a+"\\%\\), Rule = "+b;
              answer = b;
              break;
              
              // Percent to decimal and rule
              /*
              case 2:
              problem = "The scale factor from shape \\(A\\) to shape \\(B\\) is \\("+a+"\\%\\). What is this written as a decimal and as a coordinate rule?";
              answer = "Decimal = \\("+sf+"\\), Rule = "+b;
              break;
              */
              
              // Rule to decimal and percent
              case 1:
              //problem = "The rule from shape \\(A\\) to shape \\(B\\) is "+b+". What is the scale factor written as a decimal and as a percent?";
              problem = "The rule from shape \\(A\\) to shape \\(B\\) is "+b+". What is the scale factor?";
              //answer = "Decimal = \\("+sf+"\\), Percent = \\("+a+"\\%\\)";
              answer = "\\("+sf+"\\)";
              break;
           
           }
           
           break;
           
           // Using the scale factor
           // Determine how the scale factor (as a percent, decimal, or rule) affects coordnates, side lengths, perimeter, area, angles
           case 2: 
           sf = randomDec(2,10,1); 
           a = formatDec(sf*100); // percent
           b = "\\(("+sf+"x, "+sf+"y)\\)"; //rule
           
           problem = "Triangle \\(ABC\\) is similar to triangle \\(DEF\\). ";
           
           // determine the format of the scale factor
           switch(random(0,0)){
              
              // scale factor is a decimal
              case 0:
              problem += "The scale factor from \\(ABC\\) to \\(DEF\\) is \\("+sf+"\\).";
              break;
              
              /*
              // scale factor is a percent
              case 2:
              problem += "The scale factor from \\(ABC\\) to \\(DEF\\) is \\("+a+"\\%\\).";
              break;

              // scale factor is given as a rule
              case 1:
              problem += "The rule from \\(ABC\\) to \\(DEF\\) is "+b+".";
              break;
              */
           
           }
           
           problem += "<br><br>";

           // determine the affected parts
           // only change side lengths
           switch(random(1,1)){
           
              // coordinates (*sf)
              case 0:
              c = random(-10,10);
              d = random(-10,10);
              e = formatDec(sf*c);
              f = formatDec(sf*d);
              
              problem += " If \\(A = ("+c+", "+d+")\\) corresponds to \\(D\\), what are the coordinates of \\(D\\)?"; 
              answer = "\\(D = ("+e+", "+f+")\\)";
              break;
               
              // side lengths (*sf)
              case 1:
              c = random(2,15);
              d = formatDec(sf*c);
              
              problem += " If \\(AB = "+c+"\\) and \\(AB\\) corresponds to \\(DE\\), what is the length of \\(DE\\)?"; 
              answer = "\\(DE = "+d+"\\)"; 
              break;
               
              // perimeters (*sf)
              case 2:
              c = random(10,50);
              d = formatDec(sf*c);
              
              problem += " If the perimeter of \\(ABC\\) is \\("+c+"\\), what is the perimeter of \\(DEF\\)?"; 
              answer = "The perimeter of \\(DEF\\) is \\("+d+"\\)";  
              break;
               
              // areas (*sf*sf)
              case 3:
              c = random(10,50);
              d = formatDec(sf*sf*c);
              
              problem += " If the area of \\(ABC\\) is \\("+c+"\\), what is the area of \\(DEF\\)?"; 
              answer = "The area of \\(DEF\\) is \\("+d+"\\)";  
              break; 
               
              // angles (unchanged)
              case 4:
              c = random(10, 100);
              
              problem += " If angle \\(A = "+c+"^{\\circ}\\) and angle \\(A\\) corresponds to angle \\(D\\), what is the measure of angle \\(D\\)?"; 
              answer = "Angle \\(D = "+c+"^{\\circ}\\)";  
              break;
           }
           
           break;

           // scale drawings
           case 3:

            var person = generateName();
            var name = person.name;
            var pron = person.pronoun;
            var scale = randomDec(1.1,3,1);
            var actualLength = randomDec(3,6,1);
            var scaleLength = formatDec(actualLength*scale);
            var actualWidth = randomDec(2,4,1);
            var scaleWidth = formatDec(actualWidth*scale);
            var scalePerim = formatDec(2*scaleLength+2*scaleWidth);
            var actualPerim = formatDec(2*actualLength+2*actualWidth);
            var scaleArea = formatDec(scaleLength*scaleWidth);
            var actualArea = formatDec(actualLength*actualWidth);

            problem = `${name} created a scale drawing of ${pron} bedroom for a class project using a scale of 1 ft to ${scale} cm. `
            
            switch(random(0,1)){

              // Given drawing measurements
              case 0:
              problem += `On the drawing, ${name}'s rectangular bed is ${scaleLength} cm long and ${scaleWidth} cm wide. <br>`;

                switch(random(0,3)){
                  
                  // find the length
                  case 0:
                  problem += `What is the actual length, in feet, of ${name}'s bed?`;
                  answer = `${actualLength} ft`;
                  break;

                  // find the width
                  case 1:
                  problem += `What is the actual width, in feet, of ${name}'s bed?`;
                  answer = `${actualWidth} ft`;

                  break;

                  // find the perimeter
                  case 2:
                  problem += `What is the actual perimeter, in feet, of ${name}'s bed?`;
                  answer = `${actualPerim} ft`;

                  break;

                  // find the area
                  case 3:
                  problem += `What is the actual area, in square feet, of ${name}'s bed?`;
                  answer = `${actualArea} square ft`;
                  break;

                }

              break;

              // Given actual measurements
              case 1:
              problem += `${name}'s actual rectangular bed is ${actualLength} ft long and ${actualWidth} ft wide. <br>`;

                switch(random(0,3)){
                  
                  // find the length
                  case 0:
                  problem += `On the scale drawing, what is the length, in centimeters, of ${name}'s bed?`;
                  answer = `${scaleLength} cm`;
                  break;

                  // find the width
                  case 1:
                  problem += `On the scale drawing, what is the width, in centimeters, of ${name}'s bed?`;
                  answer = `${scaleWidth} cm`;

                  break;

                  // find the perimeter
                  case 2:
                  problem += `On the scale drawing, what is the perimeter, in centimeters, of ${name}'s bed?`;
                  answer = `${scalePerim} cm`;

                  break;

                  // find the area
                  case 3:
                  problem += `On the scale drawing, what is the area, in square centimeters, of ${name}'s bed?`;
                  answer = `${scaleArea} square cm`;
                  break;

                }

              break;

            }

           break;

          // scale map
           case 4:
           var scale = random(4,12)*5;
          
           var options = [
                            {city1: "New York City", city2: "Washington, D.C.", dist: 225},
                            {city1: "New York City", city2: "Los Angeles", dist: 2445},
                            {city1: "Chicago", city2: "Houston", dist: 940},
                            {city1: "Boston", city2: "New York City", dist: 190},
                            {city1: "London", city2: "Paris", dist: 210},
                            {city1: "London", city2: "Dubai", dist: 3400},
                            {city1: "Los Angeles", city2: "San Francisco", dist: 345},
                            {city1: "Miami", city2: "New York City", dist: 1090},
                            {city1: "Seattle", city2: "Los Angeles", dist: 960},
                            {city1: "Dallas", city2: "Chicago", dist: 3400} 
                          ];

           problem = `A map has a scale of 1 centimeter = ${scale} miles. `;

           var selected = options[random(0,options.length-1)];
           var scaleDist = formatDec(Math.round(selected.dist/scale*10000)/10000);

           switch(random(0,1)){

              // given actual
              case 0:
              problem += `The actual distance between ${selected.city1} and ${selected.city2}, is ${selected.dist} miles. <br> What is the distance, in centimeters, between the two cities on the map?`;
              answer = `${scaleDist} centimeters`;
              break;

              // given scale
              case 1:
              problem += `The scale distance on the map between ${selected.city1} and ${selected.city2}, is ${scaleDist} centimeters. <br> What is the actual distance, in miles, between the two cities?`;
              answer = `${selected.dist} miles`;
              break;

           }
           break;
       }
            
       $("#generated").html(problem);
       $("#answer").html(doublesigns(answer));
       renderMathInElement(document.body);
	}

</script>
